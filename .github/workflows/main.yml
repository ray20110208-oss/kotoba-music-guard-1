name: Build Kotoba APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract latest source
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'Kotoba-Music-Guard-source-*.zip' | sort -V | tail -n 1)"
          test -n "$ZIP_FILE"
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          test -f project/gradlew
          echo "Building $ZIP_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotoba-Music-Guard-latest
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
