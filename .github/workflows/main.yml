name: Build Kotoba APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/battery-monitor, feat/realtime-subtitles]
    paths:
      - "*.zip"
      - "*.zip.part-*"
      - "source-overrides/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare verified source and overrides
        run: python3 scripts/prepare_source.py project

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test relay without API credentials
        working-directory: project/backend
        run: npm ci && npm test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test streaming audio adapter
        run: bash scripts/test-audio.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotoba-Music-Guard-v0.3.0-alpha1-realtime
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
