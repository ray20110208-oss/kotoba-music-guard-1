name: Build Kotoba APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/battery-monitor]
    paths:
      - "*.zip"
      - "*.zip.part-*"
      - "source-overrides/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract latest source
        shell: bash
        run: |
          PART_PREFIX="$(find . -maxdepth 1 -type f -name 'Kotoba-Music-Guard-source-*.zip.part-*' -printf '%f\n' | sed 's/\.part-[0-9][0-9]*$//' | sort -Vu | tail -n 1)"
          if [ -n "$PART_PREFIX" ]; then
            cat "${PART_PREFIX}".part-* > source.zip
            echo 'df40c2a3b1f06c902168f996a10c900efb017c0bcc4bc8f35f4bdce69c1490d1  source.zip' | sha256sum -c -
            ZIP_FILE=source.zip
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name 'Kotoba-Music-Guard-source-*.zip' | sort -V | tail -n 1)"
          fi
          test -n "$ZIP_FILE"
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          test -f project/gradlew
          echo "Building $ZIP_FILE"

      - name: Apply tracked source updates
        run: cp -R source-overrides/. project/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotoba-Music-Guard-v0.2.5-alpha5-battery1
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
